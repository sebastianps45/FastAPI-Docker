name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (opcional)
        run: |
          # Ajusta o elimina esta línea según tu suite de tests
          pytest -q || true

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering Render deploy..."
          curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -d '{}'

# Notas:
# - Crea los secrets `RENDER_API_KEY` y `RENDER_SERVICE_ID` en tu repositorio GitHub (Settings → Secrets → Actions).
# - Para obtener `RENDER_API_KEY`: Dashboard de Render → Account → API Keys.
# - Para obtener `RENDER_SERVICE_ID`: el ID aparece en la URL o en la configuración del servicio en Render.
# - Este workflow lanza un deploy en Render tras cada push a `main`.
